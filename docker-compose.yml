services:
  multiotp:
    image: multiotp/multiotp-open-source:5.10.4.3
    container_name: multiotp-server
    restart: unless-stopped
    expose:
      - "443"
    volumes:
      - ./data/multiotp:/etc/multiotp
      - ./logs/multiotp:/var/log/multiotp
    environment:
      - TZ=${TZ:-Asia/Bishkek}
    networks:
      - multiotp_internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27.2-alpine3.20
    container_name: multiotp-nginx-proxy
    restart: unless-stopped
    depends_on:
      - multiotp
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    environment:
      - TZ=${TZ:-Asia/Bishkek}
    networks:
      - multiotp_internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  multiotp_internal:
    driver: bridge
    internal: false
