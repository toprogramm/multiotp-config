user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Скрываем версию Nginx
    server_tokens off;

    # Формат логов с учетом времени ответа
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Защита от брутфорса и DDoS (с запасом под загрузку статики веб-интерфейса)
    limit_req_zone $binary_remote_addr zone=multiotp_login:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=multiotp_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
