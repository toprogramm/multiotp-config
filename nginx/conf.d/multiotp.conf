# Основной HTTPS-сервер проксирования multiOTP (работает только по защищенному порту 443, по IP и по домену)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Локальные корпоративные TLS/SSL сертификат и закрытый ключ
    ssl_certificate     /etc/nginx/certs/multiotp.crt;
    ssl_certificate_key /etc/nginx/certs/multiotp.key;

    # Современные настройки безопасности TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Заголовки безопасности для корпоративного контура
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; frame-ancestors 'self';" always;

    # Ограничение соединений и запросов с одного IP (защита от брутфорса без блокировки статики)
    limit_conn multiotp_conn 50;
    limit_req zone=multiotp_login burst=60 nodelay;

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        # ВАЖНО: Внутри контейнера multiotp порт 80 делает безусловный 301-редирект на HTTPS,
        # поэтому проксируем запросы напрямую на внутренний порт 443 контейнера multiotp!
        proxy_pass https://multiotp:443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        # Передача оригинального Host ($http_host сохраняет как домен, так и IP из адресной строки)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;

        # Защита куки при работе через HTTPS-прокси
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Strict";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
